[package]
name = "razer-lite"
version = "0.1.0"
edition = "2021"
description = "Razer 鼠标轻量离线工具：侧键映射、DPI、回报率、电量"

[lib]
name = "rlite"
path = "src/lib.rs"

[[bin]]
name = "razer-lite"
path = "src/main.rs"

[[bin]]
name = "razer-lite-settings"
path = "src/bin/settings/main.rs"

[build-dependencies]
embed-resource = "3"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
egui = { version = "0.33", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "0.33", default-features = false, features = ["clipboard"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
softbuffer = { version = "0.4", default-features = false }

[dependencies.windows-sys]
version = "0.59"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_Devices_HumanInterfaceDevice",
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_Console",
  "Win32_Graphics_Gdi",
  "Win32_System_Registry",
  "Win32_System_Memory",
  "Win32_System_ProcessStatus",
  "Win32_System_Diagnostics_ToolHelp",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
